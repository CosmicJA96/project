{% extends "layout.html" %}
{% block body %}
<!--heading-->
<div class="title-bar">
    <h1><ins>{{moon[2]}}</ins></h1>
</div>
<!--moon image-->
<div class="info">
    <div>
        <img src="{{ moon[4] }}" alt="">
    </div>
    <!--moon info here-->
    <div>
        <h2>Info</h2>
        <p>Diameter: {{moon[3]}}km</p>
        <p>Orbital Speed: {{moon[5]}}km/s</p>
        <p>Description: {{moon[6]}}</p>
    </div>
</div>
{% endblock %}
